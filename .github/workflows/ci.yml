name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the image
        run: docker build -t satishweb/unbound:ci .

      - name: Scan the image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/unbound:ci
          format: table
          output: /tmp/trivy.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy.txt

      - name: Generate the bill of materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/unbound:ci
          format: cyclonedx
          output: /tmp/sbom.cdx.json

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: /tmp/sbom.cdx.json
          if-no-files-found: error

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests docker

      - name: Run the tests
        run: |
          python ./tests/test-unbound-server.py --image satishweb/unbound:ci

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review the dependencies of the pull request
        uses: actions/dependency-review-action@v4

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          set -euo pipefail
          version=0.11.0
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSL -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${archive}" \
            | sha256sum --check
          tar -xf "${archive}"
          echo "SHELLCHECK_BIN=${PWD}/shellcheck-v${version}" >> "${GITHUB_ENV}"

      - name: Run shellcheck
        run: |
          "${SHELLCHECK_BIN}/shellcheck" --version
          "${SHELLCHECK_BIN}/shellcheck" -x \
            docker-entrypoint \
            docker-healthcheck \
            build.sh \
            app-config-example \
            scripts/update_blocked_hosts.sh
