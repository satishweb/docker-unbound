# Build and publish the container image for a release tag.
#
# The tag has to have the form v<version>[-<number>], for example v1.25.2-r2.
# The version is the version of the unbound package that is installed, it has
# to match the version of the alpine release the image is built from.
#
# The image is published to the Docker Hub and to the GitHub container
# registry.
#
# The workflow can be started by hand with a dry run, that builds the image
# without publishing it.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, for example v1.25.2-r2"
        required: true
        type: string
      dry_run:
        description: "Build the image without publishing it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: unbound
  DOCKERHUB_OWNER: satishweb

jobs:
  gate:
    name: Check the build of the branch
    runs-on: ubuntu-latest
    steps:
      - name: The CI workflow has to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking for a successful CI run for ${COMMIT}."
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&status=completed&per_page=20" \
            --jq '[.workflow_runs[].conclusion] | if index("success") then "success" else "none" end')
          if [ "${conclusion}" != "success" ]; then
            echo "::error::The CI workflow did not pass for ${COMMIT}. A release can only be cut from a commit that was built and tested on the branch."
            exit 1
          fi
          echo "The CI workflow passed for ${COMMIT}."

  verify:
    name: Verify the image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        fetch-depth: 0
      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-r[0-9]+)$ ]]; then
            echo "::error::The tag ${tag} does not have the expected form v<version>-r<revision>."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # The image is built for the platform of the runner, that is enough
          # to test it. The image for all the platforms is built by the
          # publish job.
          platforms: linux/amd64
          build-args: |
            UNBOUND_VERSION=${{ steps.release.outputs.version }}
          load: true
          tags: unbound:verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: unbound:verify
          format: table
          output: /tmp/trivy.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy.txt

      - name: Generate the bill of materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: unbound:verify
          format: cyclonedx
          output: /tmp/sbom.cdx.json

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: /tmp/sbom.cdx.json
          if-no-files-found: error

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Test the image
        run: |
          python ./tests/test-unbound-server.py --image unbound:verify

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        fetch-depth: 0
      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-r[0-9]+)$ ]]; then
            echo "::error::The tag ${tag} does not have the expected form v<version>-r<revision>."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "The unbound version is ${version}."
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:latest"
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |
          set -euo pipefail
          tags="${{ steps.release.outputs.tags }}"
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$tags"
          docker buildx build --push --provenance=false --platform linux/amd64 -f Dockerfile "${args[@]}" .
  scan-platforms:
    name: Scan the published image
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7, linux/arm/v6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        fetch-depth: 0
      - name: Pull the image of the platform
        run: |
          docker pull --platform ${{ matrix.platform }} \
            satishweb/unbound:${{ inputs.tag || github.ref_name }}

      - name: Scan the image of the platform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: satishweb/unbound:${{ inputs.tag || github.ref_name }}
          format: table
          output: /tmp/trivy-${{ matrix.platform }}.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the platform
        if: always()
        run: cat /tmp/trivy-${{ matrix.platform }}.txt

  release:
    name: GitHub release
    needs: scan-platforms
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "The release ${TAG} exists already, its notes are updated."
            gh release edit "${TAG}" --title "${TAG}" --generate-notes
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
