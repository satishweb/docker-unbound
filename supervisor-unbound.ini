# Author: Satish Gaikwad <satish@satishweb.com>
[supervisord]
nodaemon=true
user=unbound
# The container runs as the user of the resolver, the socket and the log file
# have to be in a directory that the user can write to.
file=/tmp/supervisord.sock
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[program:crond]
command = crond -f
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:unbound]
command = unbound
autostart=true
autorestart=true
environment=USER="unbound"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
